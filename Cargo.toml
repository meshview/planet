[package]
name = "meshview-planet"
description = "A world map of the nodes every Meshview instance sees"
version = "1.0.0-dev"
edition = "2024"
# Meshview is AGPL-3.0, and so is this.
license = "AGPL-3.0-or-later"
authors = ["Óscar García Amor <ogarcia@connectical.com>"]
repository = "https://github.com/meshview/planet"
readme = "README.md"
keywords = ["meshtastic", "meshview", "mesh", "map"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
# The cached answers are kept compressed, so the large ones are compressed once
# rather than on every request.
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
# Dates for the daily counts, in UTC.
jiff = "0.2"
# The client that polls the instances. TLS through rustls with `ring` and the
# compiled in roots, as Meshview does for MQTT: no aws-lc to cross compile, and
# no ca-certificates needed in the image.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "stream"] }
# The pages and their files, built into the binary.
rust-embed = { version = "8", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tera = { version = "2.4", features = ["preserve_order"] }
toml = "0.9"
tower-http = { version = "0.7", default-features = false, features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = "6"
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
webpki-roots = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
# Only to call the router the way axum does, with `ServiceExt::oneshot`.
tower = { version = "0.5", default-features = false, features = ["util"] }
